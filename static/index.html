<!DOCTYPE html>
<!--
  Single page served by app/main.py at "/". No build step, no frameworks.
  Files: this page (structure), style.css (look), app.js (behaviour).
  app.js finds elements by the ids below, so keep the ids if you restyle or rearrange the page.
  Flow: the user picks an image, app.js POSTs it to /restore, and the server streams back
  the u-map first and the restored image later (see the header of app.js for the format).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Restoration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Image Restoration</h1>
    <p class="intro">Upload a noisy photo. You get the u-map (where the denoiser is unsure) first, then the restored image.</p>

    <!-- Upload form. app.js intercepts the submit; the file field is sent to the server as "file". -->
    <form id="upload-form">
      <input id="file-input" name="file" type="file" accept="image/*" required>
      <button id="restore-button" type="submit">Restore</button>
    </form>

    <!-- Status line: progress text and error messages (app.js writes into it). -->
    <p id="status" role="status"></p>

    <!-- Three result panels. Each has a placeholder that app.js hides once the image arrives. -->
    <section class="panels">
      <figure>
        <figcaption>Original</figcaption>
        <p class="placeholder" id="original-placeholder">No image chosen</p>
        <img id="original-img" alt="Original image" hidden>
      </figure>

      <figure>
        <figcaption>U-map <span class="time" id="umap-time"></span></figcaption>
        <p class="placeholder" id="umap-placeholder">Waiting</p>
        <img id="umap-img" alt="U-map: brighter means more uncertain" hidden>
      </figure>

      <figure>
        <figcaption>Restored <span class="time" id="restored-time"></span></figcaption>
        <p class="placeholder" id="restored-placeholder">Waiting</p>
        <img id="restored-img" alt="Restored image" hidden>
      </figure>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
